name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run Tests
        run: npm run test
      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run Unit Tests
        run: npm run test
      - name: Build
        # Dummy values so `next build` can statically analyze pages without
        # a live backend/DB. Replace repo secrets for real deploy previews.
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/api
          MONGODB_URI: mongodb://localhost:27017/ci-placeholder
        run: npm run build

  # E2E tests are disabled in CI by default (require a running backend + MongoDB).
  # Enable by removing `if: false` and adding a MongoDB service container.
  # Run locally with: npx playwright test
  e2e:
    if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Start backend
        run: npm run dev &
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017/gymrathub-e2e
          JWT_SECRET: e2e_test_jwt_secret
          PORT: 5000
      - name: Start frontend
        run: npm run dev &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
      - name: Wait for services
        run: npx wait-on http://localhost:3000 http://localhost:5000/health --timeout 30000
      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
